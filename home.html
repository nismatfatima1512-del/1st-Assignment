<!DOCTYPE html>
<html style="background-color: rgb(250, 254, 228);">
    <head>
        <title>Registration Form</title>
    </head>
    <body> 
        <h1 style= "text-align: center;">Student Registration Form</h1> 
        <form style="text-align: left;">
            <label for ="name" style="font-weight: bold;">Name:</label>
            <br>
            <input type="text" id="name" name="name" required>

            <br>
            <pre></pre>
            <label for = "email" style="font-weight: bold;">Email:</label>
            <br>
            <input type= "email" id="email" name= "email" required>

            <br>
            <pre></pre>
            <label for= "password" style="font-weight: bold;">Password:</label>
            <br>
            <input type= "password" id="password" name= "password" required>
            
            <br>
            <pre></pre>
            <label for = "city" style="font-weight: bold;">City:</label>
            <br>
            <select id="city" name="city" required>
                <option value="">Select the city</option>
                <option value="Rawalpindi">Rawalpindi</option>
                <option value="Islamabad">Islamabad</option>
                <option value="Lahore">Lahore</option>
            </select>

            <br>
            <pre></pre>
            <label for="Gender" style="font-weight : bold;">Gender:</label>
            <br>
            <input type="radio" name="gender" value="male" required>
            <label for="male">Male</label>
            <br>
            <input type="radio" name="gender" value="female" required>
            <label for="female">Female</label>
            <br>
            <input type="radio" name="gender" value="other" required>
            <label for="other">Other</label>

            <br>
            <pre></pre>
            <label for ="Hobbies" style="font-weight: bold;">Hobbies:</label>
            <br>
            <input type="checkbox" name="hobbies" value="reading" required>
            <label for="reading"> Reading</label>
            <br>
            <input type="checkbox" name="hobbies" value="Drawing" required>
            <label for="Drawing">Drawing</label>
            <br>
            <input type="checkbox" name="hobbies" value="Sports" required>
            <label for = "Sports">Sports</label>
            <br>
            <input type="checkbox" name="hobbies" value="Music" required>
            <label for="Music">Music</label>
            <br>
            <input type="checkbox" name="hobbies" value="Coding" required>
            <label for="Coding">Coding</label>

            <br>
            <button type="submit" style="background-color: rgb(221, 230, 172) ; border: 2px solid black; padding: 10px 30px; text-align : center; font-size: 16px; border-radius: 5px; margin: 10px auto;">Submit</button>
    </body>
</html>
